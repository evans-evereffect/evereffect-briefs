<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Lead Prep Catalog · EverEffect</title>
<meta name="description" content="Internal BDM call prep catalog.">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,900;1,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#1B4712; --forest-deep:#0A1C08; --ink:#14210F;
  --ee:#2F8C19; --lime:#8EC63F;
  --paper:#F7F9F5; --line:rgba(27,71,18,.14); --mist:#5F6E58;
  --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
*,*:before,*:after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:0 clamp(1rem,4vw,2.5rem)}
header.hero{background:linear-gradient(160deg,var(--forest-deep),var(--forest));color:#fff;padding:2.8rem 0 2.2rem}
.brand{font-family:var(--serif);font-weight:900;font-size:1.15rem;color:var(--lime)}
.brand small{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.25em;color:rgba(255,255,255,.55);text-transform:uppercase;margin-top:.2rem}
h1.big{font-family:var(--serif);font-weight:900;font-size:clamp(1.5rem,3vw,2.1rem);line-height:1.1;margin-top:1.4rem}
.hero-sub{margin-top:.6rem;color:rgba(255,255,255,.72);max-width:600px;line-height:1.6;font-size:.88rem}
main{padding:2.2rem 0 3.4rem}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
th{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mist);text-align:left;padding:.9rem 1.1rem;border-bottom:1px solid var(--line);background:var(--paper)}
td{padding:.9rem 1.1rem;border-bottom:1px solid var(--line);font-size:.88rem;vertical-align:top}
tr:last-child td{border-bottom:none}
td a{color:var(--ee);text-decoration:none;font-weight:600;border-bottom:1px solid rgba(47,140,25,.32)}
td a:hover{border-bottom-color:var(--ee)}
.status{font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;border-radius:99px;padding:.25rem .7rem;display:inline-block;white-space:nowrap}
.s-upcoming{background:rgba(142,198,63,.16);color:var(--forest);border:1px solid rgba(47,140,25,.35)}
.s-done{background:rgba(95,110,88,.12);color:var(--mist);border:1px solid var(--line)}
footer.f{padding:1.6rem 0 2.4rem;border-top:1px solid var(--line);margin-top:1rem;font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mist)}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="brand">EverEffect<small>Internal</small></div>
    <h1 class="big">Lead Call Preps</h1>
    <p class="hero-sub">Every BDM research pack, in one place. Click a name to open the full prep.</p>
  </div>
</header>

<div class="wrap">
<main>
  <table>
    <tr>
      <th>Lead</th>
      <th>Company</th>
      <th>Call</th>
      <th>Status</th>
    </tr>
    <tr>
      <td><a href="/evereffect-briefs/leads/daniel-gordon/prep/" target="_blank" rel="noopener">Daniel Gordon</a></td>
      <td>Gold Insurance &amp; Financial Services</td>
      <td>Tue Aug 11, 2026 &middot; 10:30am EDT</td>
      <td><span class="status s-upcoming">Upcoming</span></td>
    </tr>
  </table>
</main>
</div>

<footer class="f">
  <div class="wrap">Internal only &middot; noindex &middot; add a row here every time a new prep is built</div>
</footer>
</body>
</html>
